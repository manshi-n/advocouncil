<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Student Dashboard</title><link rel="stylesheet" href="css/portal.css"></head><body><div class="dash"><aside class="side"><h2>🎓 Student</h2><a href="#profileSec">Profile</a><a href="#internships">Search Internships</a><a href="#applications">Applied Internships</a><a href="#resume">Resume</a><a href="#" onclick="logout()">Logout</a></aside><main class="main"><div class="top"><h1 id="welcome">Student Dashboard</h1><button class="btn secondary" onclick="loadAll()">Refresh</button></div><div class="grid"><div class="card"><h2 id="totalApps">0</h2><p>Applications Sent</p></div><div class="card"><h2 id="approvedApps">0</h2><p>Approved Internships</p></div><div class="card"><h2 id="pendingApps">0</h2><p>Pending Requests</p></div><div class="card"><h2 id="rejectedApps">0</h2><p>Rejected</p></div></div><section id="profileSec" class="panel"><h2>Student Profile</h2><div class="profile"><div id="avatar" class="avatar">👩‍🎓</div><div><p id="profileText"></p><input id="photoInput" type="file" accept="image/*"><button class="btn" onclick="uploadProfilePhoto()">Upload Profile Photo</button></div></div><form id="profileForm"><div class="form-grid"><input id="fullName" placeholder="Full Name"><input id="phone" placeholder="Phone"><input id="education" placeholder="Education"><input id="linkedin" placeholder="LinkedIn URL"><input id="skills" placeholder="Skills comma separated"></div><textarea id="bio" placeholder="About you, legal interests, achievements"></textarea><br><br><button class="btn">Save Profile</button></form></section><section id="resume" class="panel"><h2>Resume</h2><p id="resumeStatus"></p><input id="resumeFile" type="file" accept=".pdf,.doc,.docx,.png,.jpg,.jpeg"><button class="btn" onclick="uploadResume()">Upload Resume</button></section><section id="internships" class="panel"><h2>Internship Opportunities</h2><div class="form-grid"><input id="search" placeholder="Search field, lawyer, location"><select id="field"><option value="all">All Fields</option><option>Criminal Law</option><option>Corporate Law</option><option>Cyber Law</option><option>Family Law</option><option>Tax Law</option><option>Real Estate Law</option><option>Intellectual Property</option></select></div><div id="internshipCards" class="grid"></div></section><section id="applications" class="panel"><h2>My Applications</h2><table><thead><tr><th>Internship</th><th>Lawyer</th><th>Resume</th><th>Status</th><th>Further Details</th></tr></thead><tbody id="appRows"></tbody></table></section></main></div><script src="js/app.js"></script><script>
let user=requireLogin('student');let internships=[];let applications=[];function renderProfile(){welcome.textContent='Welcome, '+user.fullName;setAvatar(avatar,user,'👩‍🎓');profileText.innerHTML=`<b>${user.fullName}</b><br>${user.email}<br>${user.phone||''}<br>${user.education||''}<br>${user.linkedin?`<a target="_blank" href="${user.linkedin}">LinkedIn</a>`:''}<br>${(user.skills||[]).join(', ')}`;fullName.value=user.fullName||'';phone.value=user.phone||'';education.value=user.education||'';linkedin.value=user.linkedin||'';skills.value=(user.skills||[]).join(', ');bio.value=user.bio||'';resumeStatus.innerHTML=user.resume?`Current Resume: <a class="btn secondary" target="_blank" href="${fileUrl(user.resume)}">View / Download</a>`:'No resume uploaded yet.'}profileForm.onsubmit=async e=>{e.preventDefault();try{const data=await api('/auth/me',{method:'PUT',body:JSON.stringify({fullName:fullName.value,phone:phone.value,education:education.value,linkedin:linkedin.value,skills:skills.value.split(',').map(s=>s.trim()).filter(Boolean),bio:bio.value})});user=data.user;updateStoredUser(user);renderProfile();alert('Profile saved')}catch(err){alert(err.message)}};async function uploadResume(){try{if(!resumeFile.files[0])return alert('Select resume first');const fd=new FormData();fd.append('resume',resumeFile.files[0]);const data=await api('/student/upload-resume',{method:'POST',body:fd});user=data.user;updateStoredUser(user);renderProfile();alert('Resume uploaded')}catch(e){alert(e.message)}}function renderStats(){totalApps.textContent=applications.length;approvedApps.textContent=applications.filter(a=>a.status==='Approved').length;pendingApps.textContent=applications.filter(a=>a.status==='Pending').length;rejectedApps.textContent=applications.filter(a=>a.status==='Rejected').length}function renderInternships(){const q=search.value.toLowerCase();const f=field.value;const applied=new Set(applications.map(a=>String(a.internship?._id||a.internship)));const list=internships.filter(i=>(f==='all'||i.field===f)&&(`${i.title} ${i.field} ${i.lawyerName} ${i.location}`.toLowerCase().includes(q)));internshipCards.innerHTML=list.length?list.map(i=>`<div class="card"><h3>${i.title}</h3><p><b>${i.field}</b> with ${i.lawyerName}</p><p>${i.description}</p><p>${i.location} • ${i.duration} • Stipend ${money(i.stipend)}</p><p>Skills: ${(i.skillsRequired||[]).join(', ')}</p>${applied.has(String(i._id))?'<span class="badge">Already Applied</span>':`<textarea id="msg_${i._id}" placeholder="Message to lawyer"></textarea><br><br><input id="res_${i._id}" type="file" accept=".pdf,.doc,.docx,.png,.jpg,.jpeg"><button class="btn" onclick="applyInternship('${i._id}')">Apply with Resume</button>`}</div>`).join(''):'<div class="card">No internships found.</div>'}async function applyInternship(id){try{const fd=new FormData();const msg=document.getElementById('msg_'+id).value;const file=document.getElementById('res_'+id).files[0];fd.append('message',msg);if(file)fd.append('resume',file);const data=await api('/internships/'+id+'/apply',{method:'POST',body:fd});alert(data.message);await loadAll()}catch(e){alert(e.message)}}function renderApplications(){appRows.innerHTML=applications.length?applications.map(a=>`<tr><td>${a.internship?.title||'-'}<br>${a.internship?.field||''}</td><td>${a.internship?.lawyerName||'-'}</td><td><a class="btn secondary" target="_blank" href="${fileUrl(a.resume)}">View Resume</a></td><td class="${a.status}">${a.status}</td><td>${a.status==='Approved'?`<b>Selected</b><br>${a.lawyerMessage||''}<br>Contact: ${a.lawyerContact||a.internship?.lawyerPhone||''}`:a.status==='Rejected'?`Not selected<br>${a.lawyerMessage||''}`:'Waiting for lawyer response'}</td></tr>`).join(''):'<tr><td colspan="5">No applications yet.</td></tr>'}async function loadAll(){try{const me=await api('/auth/me');user=me.user;updateStoredUser(user);renderProfile();const [ints,apps]=await Promise.all([api('/internships'),api('/internships/my-applications')]);internships=ints.data;applications=apps.data;renderStats();renderInternships();renderApplications()}catch(e){alert(e.message)}}search.oninput=renderInternships;field.onchange=renderInternships;loadAll();
</script></body></html>
