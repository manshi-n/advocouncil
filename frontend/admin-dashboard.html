<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Dashboard</title><link rel="stylesheet" href="css/portal.css"></head><body><div class="dash"><aside class="side"><h2>⚙️ Admin</h2><a href="#usersSec">Users</a><a href="#apptsSec">Appointments</a><a href="#internSec">Internships</a><a href="#" onclick="logout()">Logout</a></aside><main class="main"><h1>Admin Dashboard</h1><div class="grid"><div class="card"><h2 id="usersCount">0</h2><p>Users</p></div><div class="card"><h2 id="lawyersCount">0</h2><p>Lawyers</p></div><div class="card"><h2 id="appointmentsCount">0</h2><p>Appointments</p></div><div class="card"><h2 id="paymentsCount">0</h2><p>Payments</p></div></div><section id="usersSec" class="panel"><h2>Users</h2><table><thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Phone</th></tr></thead><tbody id="usersRows"></tbody></table></section><section id="apptsSec" class="panel"><h2>Appointments</h2><table><thead><tr><th>Customer</th><th>Lawyer</th><th>Status</th><th>Payment</th><th>Amount</th></tr></thead><tbody id="apptRows"></tbody></table></section><section id="internSec" class="panel"><h2>Internships & Applications</h2><table><thead><tr><th>Title</th><th>Lawyer</th><th>Applicants</th></tr></thead><tbody id="intRows"></tbody></table><h3>Applications</h3><table><thead><tr><th>Student</th><th>Internship</th><th>Status</th></tr></thead><tbody id="appRows"></tbody></table></section></main></div><script src="js/app.js"></script><script>
requireLogin('admin');async function load(){try{const d=await api('/admin/dashboard');usersCount.textContent=d.users.length;lawyersCount.textContent=d.lawyers.length;appointmentsCount.textContent=d.appointments.length;paymentsCount.textContent=d.payments.length;usersRows.innerHTML=d.users.map(u=>`<tr><td>${u.fullName}</td><td>${u.email}</td><td>${u.userType}</td><td>${u.phone||''}</td></tr>`).join('');apptRows.innerHTML=d.appointments.map(a=>`<tr><td>${a.customerName}</td><td>${a.lawyerName}</td><td>${a.status}</td><td>${a.paymentStatus}</td><td>${money(a.totalAmount)}</td></tr>`).join('');intRows.innerHTML=d.internships.map(i=>`<tr><td>${i.title}</td><td>${i.lawyerName}</td><td>${i.applicantsCount||0}</td></tr>`).join('');appRows.innerHTML=d.applications.map(a=>`<tr><td>${a.studentName}</td><td>${a.internship?.title||'-'}</td><td>${a.status}</td></tr>`).join('')}catch(e){alert(e.message)}}load();
</script></body></html>
