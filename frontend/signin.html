<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Sign In - AdvoCouncil</title><style>body{margin:0;font-family:Segoe UI;background:#eef4ff}.wrap{min-height:100vh;display:flex;align-items:center;justify-content:center}.card{background:white;width:100%;max-width:480px;border-radius:20px;padding:38px;box-shadow:0 12px 35px #0001}.group{margin-bottom:18px}label{font-weight:700;display:block;margin-bottom:7px}input,select{width:100%;box-sizing:border-box;padding:13px;border:1px solid #cbd5e1;border-radius:10px;font-size:15px}button{width:100%;padding:14px;border:0;border-radius:10px;background:#2563eb;color:white;font-size:17px;font-weight:700;cursor:pointer}.muted{text-align:center;color:#64748b}</style></head><body><main class="wrap"><section class="card"><h1>⚖️ Welcome Back</h1><p class="muted">Login to your portal.</p><form id="signinForm"><div class="group"><label>Email</label><input id="email" type="email" required></div><div class="group"><label>Password</label><input id="password" type="password" required></div><div class="group"><label>Login As</label><select id="userType" required><option value="">Select</option><option value="customer">Customer</option><option value="lawyer">Lawyer</option><option value="student">Student</option></select></div><button>Sign In</button></form><p class="muted">No account? <a href="signup.html">Create one</a></p></section></main><script src="js/app.js"></script><script>
signinForm.onsubmit=async(e)=>{e.preventDefault();try{const data=await api('/auth/login',{method:'POST',body:JSON.stringify({email:email.value,password:password.value,userType:userType.value})});setSession(data);location.href=data.user.userType+'-dashboard.html';}catch(err){alert(err.message)}};
</script></body></html>
