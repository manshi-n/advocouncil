<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Sign Up - AdvoCouncil</title><style>
body{margin:0;font-family:Segoe UI;background:#eef4ff}.wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:30px}.card{background:white;width:100%;max-width:720px;border-radius:20px;padding:38px;box-shadow:0 12px 35px #0001}.row{display:grid;grid-template-columns:1fr 1fr;gap:16px}.group{margin-bottom:16px}label{font-weight:700;display:block;margin-bottom:7px}input,select,textarea{width:100%;box-sizing:border-box;padding:13px;border:1px solid #cbd5e1;border-radius:10px;font-size:15px}button{width:100%;padding:14px;border:0;border-radius:10px;background:#2563eb;color:white;font-size:17px;font-weight:700;cursor:pointer}.muted{text-align:center;color:#64748b}.extra{display:none;background:#eff6ff;padding:15px;border-radius:12px;margin-bottom:16px}@media(max-width:700px){.row{grid-template-columns:1fr}.card{padding:24px}}</style></head><body><main class="wrap"><section class="card"><h1>⚖️ Create AdvoCouncil Account</h1><p class="muted">Choose Customer, Lawyer, or Student portal.</p><form id="signupForm"><div class="row"><div class="group"><label>Full Name</label><input id="fullName" required></div><div class="group"><label>Email</label><input id="email" type="email" required></div></div><div class="row"><div class="group"><label>Password</label><input id="password" type="password" minlength="6" required></div><div class="group"><label>Portal</label><select id="userType" required><option value="">Select</option><option value="customer">Customer</option><option value="lawyer">Lawyer</option><option value="student">Student</option></select></div></div><div class="row"><div class="group"><label>Phone</label><input id="phone"></div><div class="group"><label>Bio</label><input id="bio" placeholder="Short profile"></div></div><div id="lawyerExtra" class="extra"><h3>Lawyer Profile Details</h3><div class="row"><div class="group"><label>Specialization</label><select id="specialization"><option>Criminal Law</option><option>Corporate Law</option><option>Cyber Law</option><option>Family Law</option><option>Tax Law</option><option>Real Estate Law</option><option>Intellectual Property</option></select></div><div class="group"><label>Payment Rate / Consultation Fee</label><input id="hourlyRate" type="number" value="1000"></div></div><div class="row"><div class="group"><label>Experience Years</label><input id="experience" type="number" value="1"></div><div class="group"><label>Location</label><input id="location" value="India"></div></div></div><button>Create Account</button></form><p class="muted">Already have account? <a href="signin.html">Sign in</a></p></section></main><script src="js/app.js"></script><script>
userType.onchange=()=>lawyerExtra.style.display=userType.value==='lawyer'?'block':'none';
signupForm.onsubmit=async(e)=>{e.preventDefault();try{const body={fullName:fullName.value,email:email.value,password:password.value,userType:userType.value,phone:phone.value,bio:bio.value,specialization:specialization.value,hourlyRate:hourlyRate.value,experience:experience.value,location:location.value};const data=await api('/auth/register',{method:'POST',body:JSON.stringify(body)});setSession(data);alert('Account created');location.href=data.user.userType+'-dashboard.html';}catch(err){alert(err.message)}};
</script></body></html>
