<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Find Lawyers</title><link rel="stylesheet" href="css/portal.css"><style>.wrap{max-width:1200px;margin:30px auto;padding:0 20px}.lawyer-card h3{margin-top:0}.filters{display:grid;grid-template-columns:1fr 220px;gap:12px;margin:20px 0}@media(max-width:700px){.filters{grid-template-columns:1fr}}</style></head><body><main class="wrap"><a href="index.html">← Home</a><h1>Find Lawyers</h1><div class="filters"><input id="search" placeholder="Search by name, field, city"><select id="specialization"><option value="all">All Fields</option><option>Criminal Law</option><option>Corporate Law</option><option>Cyber Law</option><option>Family Law</option><option>Tax Law</option><option>Real Estate Law</option><option>Intellectual Property</option></select></div><div id="lawyers" class="grid"></div></main><script src="js/app.js"></script><script>
let all=[];async function load(){try{const d=await api('/lawyers');all=d.data;render()}catch(e){lawyers.innerHTML='<div class="card">'+e.message+'</div>'}}function render(){const q=search.value.toLowerCase();const sp=specialization.value;let arr=all.filter(l=>(sp==='all'||l.specialization===sp)&&(`${l.name} ${l.specialization} ${l.location}`.toLowerCase().includes(q)));lawyers.innerHTML=arr.length?arr.map(l=>`<div class="card lawyer-card"><div class="profile"><div class="avatar">${l.image?`<img src="${fileUrl(l.image)}" style="width:100%;height:100%;object-fit:cover">`:'⚖️'}</div><div><h3>${l.name}</h3><p>${l.specialization} • ${l.location}</p></div></div><p>${l.description||''}</p><p>⭐ ${l.rating||4.5} | ${l.experience||0} years | Cases Won: ${l.casesWon||0}/${l.totalCases||0}</p><h3>Fee: ${money(l.hourlyRate)}</h3><a class="btn" href="lawyer-detail.html?id=${l._id}">View / Request Appointment</a></div>`).join(''):'<div class="card">No lawyers found</div>'}search.oninput=render;specialization.onchange=render;load();
</script></body></html>
