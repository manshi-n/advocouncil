<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Request Appointment</title><link rel="stylesheet" href="css/portal.css"><style>.wrap{max-width:760px;margin:30px auto;padding:0 20px}</style></head><body><main class="wrap"><a href="lawyers.html">← Lawyers</a><section class="panel"><h1>Send Appointment Request</h1><div id="lawyerBox" class="card">Loading lawyer...</div><form id="form"><div class="form-grid"><div><label>Date</label><input id="date" type="date" required></div><div><label>Time</label><input id="time" type="time" required></div></div><label>Case Type</label><select id="caseType"><option>Criminal Law</option><option>Corporate Law</option><option>Cyber Law</option><option>Family Law</option><option>Tax Law</option><option>Real Estate Law</option></select><br><br><label>Case Study / Details</label><textarea id="notes" placeholder="Explain your issue, urgency, documents, phone details..."></textarea><br><br><p class="badge">Payment happens only after lawyer approval.</p><br><br><button class="btn">Send Request</button></form></section></main><script src="js/app.js"></script><script>
const user=requireLogin('customer');const lawyerId=new URLSearchParams(location.search).get('lawyerId');let lawyer=null;async function load(){try{const d=await api('/lawyers/'+lawyerId);lawyer=d.data;lawyerBox.innerHTML=`<h2>${lawyer.name}</h2><p>${lawyer.specialization} • ${lawyer.location}</p><h3>Fee after approval: ${money(lawyer.hourlyRate)}</h3>`}catch(e){alert(e.message);location.href='lawyers.html'}}form.onsubmit=async e=>{e.preventDefault();try{await api('/appointments',{method:'POST',body:JSON.stringify({lawyerId,date:date.value,time:time.value,caseType:caseType.value,notes:notes.value})});alert('Request sent to lawyer. Wait for approval.');location.href='customer-dashboard.html#appointments'}catch(err){alert(err.message)}};load();
</script></body></html>
