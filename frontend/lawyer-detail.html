<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lawyer Details</title><link rel="stylesheet" href="css/portal.css"><style>.wrap{max-width:950px;margin:30px auto;padding:0 20px}.hero{display:grid;grid-template-columns:160px 1fr;gap:20px}@media(max-width:700px){.hero{grid-template-columns:1fr}}</style></head><body><main class="wrap"><a href="lawyers.html">← Back</a><section id="box" class="panel">Loading...</section></main><script src="js/app.js"></script><script>
const id=new URLSearchParams(location.search).get('id');async function load(){try{const d=await api('/lawyers/'+id);const l=d.data;box.innerHTML=`<div class="hero"><div class="avatar" style="width:150px;height:150px">${l.image?`<img src="${fileUrl(l.image)}" style="width:100%;height:100%;object-fit:cover">`:'⚖️'}</div><div><h1>${l.name}</h1><h3>${l.specialization}</h3><p>${l.location} • ${l.experience} years experience</p><p>${l.fullBio||l.description||''}</p><p>Cases Won: ${l.casesWon||0} / Total Cases: ${l.totalCases||0}</p><h2>Consultation Fee: ${money(l.hourlyRate)}</h2><a class="btn" href="book-appointment.html?lawyerId=${l._id}">Send Appointment Request</a></div></div>`}catch(e){box.textContent=e.message}}load();
</script></body></html>
